name: CI

# Runs every test suite on windows-latest / Python 3.11.
#
# Deliberate choices:
#   * least privilege: contents: read, and nothing else;
#   * the fork-privileged pull-request trigger is NOT used - a fork's code must
#     never run with this repository's token;
#   * no secrets are referenced anywhere, because no test needs one;
#   * actions are pinned to full commit SHAs, not floating major tags;
#   * dependencies come from the pinned requirements.txt, not a loose install list.
#
# Note: the course library (Resources/) is NOT in the repository — it is
# third-party copyrighted material. Checks that need it are skipped on the
# runner; each suite prints how many it skipped, and that count is part of the
# published test summary rather than being quietly hidden.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suites (Windows - Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Environment report
        run: |
          python -c "import sys; print('Python', sys.version)"
          python -c "import sympy, matplotlib, numpy, PIL; print('sympy', sympy.__version__, '| matplotlib', matplotlib.__version__, '| numpy', numpy.__version__, '| pillow', PIL.__version__)"
          python -c "import tkinter as tk; r = tk.Tk(); r.withdraw(); print('tkinter OK ->', r.tk.call('info', 'patchlevel')); r.destroy()"
          python tools/measure_facts.py

      - name: Generate the synthetic demo library
        run: python tools/make_demo_resources.py demo_resources

      # Separate steps on purpose: a broken suite is visible at a glance.
      - name: test_visual_math_lab.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_visual_math_lab.py

      - name: test_language_dictionary.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_language_dictionary.py

      - name: test_student_tracker.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_student_tracker.py

      - name: test_topic_knowledge.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_topic_knowledge.py

      - name: test_workspace_docking_manager.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_workspace_docking_manager.py

      - name: test_ai_terminal.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_ai_terminal.py

      - name: test_egitim_token.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_egitim_token.py

      - name: test_ai_code_guard.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_ai_code_guard.py

      - name: test_public_claims.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 test_public_claims.py

      - name: smoke_dark_theme.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 smoke_dark_theme.py

      - name: smoke_lazy_panels.py
        if: ${{ !cancelled() }}
        run: ./.github/run_suite.ps1 smoke_lazy_panels.py

  lint:
    name: Syntax and byte-compile
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.11"

      - name: Byte-compile every module
        run: |
          python -m compileall -q .
          python -c "import ast,pathlib,sys; [ast.parse(p.read_text(encoding='utf-8'), str(p)) for p in list(pathlib.Path('.').glob('*.py')) + list(pathlib.Path('.').glob('*.pyw'))]; print('AST OK')"
